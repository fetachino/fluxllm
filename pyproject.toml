[project]
name = "fluxllm"
version = "0.1.0"
description = "High-throughput LLM inference engine with continuous batching and block-based KV-cache management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "fetachino" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33", "safetensors>=0.4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = [
    "fluxllm", "fluxllm.config", "fluxllm.engine", "fluxllm.executor",
    "fluxllm.cache", "fluxllm.scheduler", "fluxllm.sampling",
    "fluxllm.metrics", "fluxllm.api",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# Safety net: a stuck engine loop surfaces as a TimeoutError, not a hang.
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["benchmarks/", "scripts/"]

[tool.coverage.run]
source = ["fluxllm"]
omit = ["fluxllm/executor/hf_executor.py"]
