name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check fluxllm tests
      - name: Ruff format check
        run: ruff format --check fluxllm tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and deps
        run: |
          pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: mypy (strict-ish)
        run: mypy fluxllm

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and deps
        run: |
          pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Run unit tests with coverage
        run: |
          pytest tests -q --tb=short \
            --cov=fluxllm --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fluxllm-api:ci
          target: api
      - name: Build benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fluxllm-bench:ci
          target: benchmark
      - name: Validate compose file
        run: docker compose config --quiet
